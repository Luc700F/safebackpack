name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published rules reach an untouched codebase too.
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write
  # CodeQL reads the workflow run it belongs to when it reports results.
  # Without this it analyses everything correctly and then fails on the upload
  # with "Resource not accessible by integration".
  actions: read

jobs:
  analyze:
    name: Analyse JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
