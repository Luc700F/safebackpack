name: CodeQL

# Code scanning is free on public repositories and a paid add-on on private
# ones. This repository was private for a while, during which CodeQL analysed
# the code correctly and was then refused when filing the results — a check
# that could only ever be red. It is public again, so this runs normally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published rules reach an untouched codebase too.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # CodeQL reads the workflow run it belongs to when it reports results.
  # Without this it analyses everything correctly and then fails on the upload
  # with "Resource not accessible by integration".
  actions: read

jobs:
  analyze:
    name: Analyse JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
