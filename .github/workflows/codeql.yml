name: CodeQL

# Currently manual only, and not by choice.
#
# Code scanning is free on public repositories and a paid add-on (GitHub
# Advanced Security) on private ones. This repository is private, so CodeQL
# analyses the code correctly and is then refused when it tries to file the
# results — a check that can only ever be red.
#
# A permanently failing check teaches everyone to ignore red, which costs more
# than the check is worth. So it runs on request until one of these is true:
#   * the repository is made public, which makes scanning free, or
#   * Advanced Security is purchased.
#
# To restore it, put back the push, pull_request and schedule triggers below.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # CodeQL reads the workflow run it belongs to when it reports results.
  # Without this it analyses everything correctly and then fails on the upload
  # with "Resource not accessible by integration".
  actions: read

jobs:
  analyze:
    name: Analyse JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
